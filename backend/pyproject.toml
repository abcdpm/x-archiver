[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x-archiver-backend"
version = "0.1.0"
description = "Backend API for X (Twitter) bookmarks and likes archiver"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "twscrape>=0.20.0",
    "aiohttp>=3.14.3",
    "aiofiles>=23.2.1",
    "apscheduler>=3.10.4",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
test = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.5",
    "pytest-mock==3.12.0",
    "httpx==0.26.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py314"