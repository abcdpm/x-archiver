services:
  x-archiver:
    build: .
    container_name: x-archiver
    restart: unless-stopped
    ports:
      - "8080:8000" 
    environment:
      - TZ=Asia/Shanghai
      - TARGET_USERNAME=这里填你的X账号名
      - MEDIA_DIR=/app/media
      - DB_PATH=/app/database/archiver.sqlite
    volumes:
      - /mnt/user/appdata/x-archiver/database:/app/database
      - /mnt/user/appdata/x-archiver/media:/app/media